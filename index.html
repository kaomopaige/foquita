 setMonth(year,month){if(!Number.isInteger(year)||year<1900||year>9999||month<0||month>11){toast('Escolha um ano entre 1900 e 9999.');$('#cal-year').value=this.year;$('#cal-month').value=this.month;return}const day=Math.min(+this.selected.slice(8),new Date(year,month+1,0,12).getDate());this.choose(calendarISO(new Date(year,month,day,12)))},
 focusSelected(){calendarWindow.querySelector(`[data-cal-date="${this.selected}"]`)?.focus({preventScroll:true})},
 markDirty(){this.dirty=true;const state=$('#cal-save-state');if(state){state.textContent='Alterações não salvas';state.classList.add('dirty')}},
 routineFor(date){const log=S.log[date];return date===today()?calendarRoutine(S.check):Array.isArray(log?.routine)?calendarRoutine(log.routine):calendarRoutine(S.check)},
 render(){
  const dayDate=new Date(this.selected+'T12:00'),log=S.log[this.selected],future=this.selected>today(),entries=calendarEntries(this.selected),cells=calendarCells(this.year,this.month),monthLabel=new Date(this.year,this.month,1,12).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),monthNames=Array.from({length:12},(_,i)=>new Date(2024,i,1,12).toLocaleDateString('pt-BR',{month:'long'}));
  let routine=this.routineFor(this.selected);const missing=(log?.ids||[]).filter(id=>!routine.some(c=>c.id===id));routine.push(...missing.map(id=>({id,t:'Cuidado removido da rotina (registro antigo)',min:0,modes:['normal'],period:'livre'})));
  this.activeRoutine=routine;
  calendarWindow.innerHTML=`<header class="calendar-titlebar"><h2 id="calendar-title">▦ Calendário <span aria-hidden="true">φ(．．)</span></h2><button type="button" class="btn ghost" data-cal="close" aria-label="Fechar calendário">×</button></header>
  <div class="calendar-layout"><section class="calendar-month" aria-label="${E(monthLabel)}"><div class="calendar-toolbar"><button type="button" class="btn" data-cal="prev" aria-label="Mês anterior" ${this.year===1900&&this.month===0?'disabled':''}>‹</button><div class="calendar-selects"><label><span class="sr-only">Mês do calendário</span><select id="cal-month">${monthNames.map((m,i)=>`<option value="${i}" ${i===this.month?'selected':''}>${m}</option>`).join('')}</select></label><label><span class="sr-only">Ano do calendário</span><input id="cal-year" type="number" min="1900" max="9999" step="1" value="${this.year}"></label><button type="button" class="btn" data-cal="go">Ir</button></div><button type="button" class="btn" data-cal="next" aria-label="Próximo mês" ${this.year===9999&&this.month===11?'disabled':''}>›</button><button type="button" class="btn" data-cal="today">Hoje</button></div>
  <table class="cal-table"><caption class="sr-only">${E(monthLabel)}. Selecione um dia para ver e editar seus registros.</caption><thead><tr>${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<th scope="col">${d}</th>`).join('')}</tr></thead><tbody>${Array.from({length:6},(_,row)=>`<tr>${cells.slice(row*7,row*7+7).map(date=>{const d=calendarDate(date),l=S.log[date],ev=calendarEntries(date),has=calendarHasRecord(l),outside=d.getMonth()!==this.month,aria=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(has?', com registro':'')+(ev.length?', '+ev.length+(ev.length===1?' compromisso ou prazo':' compromissos ou prazos'):'');return `<td><button type="button" class="cal-date ${outside?'outside':''} ${date===today()?'today':''} ${date===this.selected?'selected':''}" data-cal="date" data-cal-date="${date}" ${d.getFullYear()<1900||d.getFullYear()>9999?'disabled':''} aria-label="${E(aria)}" aria-pressed="${date===this.selected}" ${date===today()?'aria-current="date"':''}><span class="cal-number">${d.getDate()}</span>${l?.mood?`<span class="cal-mood" aria-hidden="true">${FACE[l.mood]}</span>`:''}<span class="cal-entry">${ev.length?E((ev[0].time?ev[0].time+' ':'')+ev[0].t):''}</span><span class="cal-indicators">${has?'<span class="cal-dot" aria-hidden="true"></span>':''}${l?.note?'<span class="cal-note-mark" aria-hidden="true">✎</span>':''}${ev.length>1?'+'+(ev.length-1):''}</span></button></td>`}).join('')}</tr>`).join('')}</tbody></table>
  <div class="calendar-legend"><span class="row"><span class="legend-item"><span class="cal-dot" aria-hidden="true"></span> Registro</span><span class="legend-item">✎ Anotação</span></span><span>Sem marca = sem registro</span></div><div class="cal-mobile-actions"><button class="btn" type="button" data-cal="details">Ver dia selecionado ↓</button></div></section>
  <section class="calendar-day" aria-label="Detalhes do dia selecionado"><h3 id="cal-day-title" tabindex="-1">${dayDate.toLocaleDateString('pt-BR',{day:'numeric',month:'long'})}<span class="day-tag">${this.selected===today()?'Hoje':future?'Futuro':'Histórico'}</span></h3><p class="day-caption">${dayDate.toLocaleDateString('pt-BR',{weekday:'long'})} · ${dayDate.getFullYear()}</p>
  <div class="cal-section-title"><h4>Compromissos e prazos</h4><button class="btn sm" type="button" data-cal="add-event">+ Adicionar</button></div>
  ${entries.length?entries.map(e=>`<article class="cal-event"><div class="cal-event-title">${E(e.t)}</div><div class="mu">${e.time?E(e.time)+' · ':''}${E(e.label)}${e.status?' · '+E(e.status):''}</div>${e.note?`<p class="cal-event-note">${E(e.note)}</p>`:''}<div class="row">${e.kind==='event'?`<button class="btn sm" data-cal="edit-event" data-event-id="${E(e.id)}">Editar</button><button class="btn sm ghost" data-cal="delete-event" data-event-id="${E(e.id)}">Excluir</button>`:`<button class="btn sm" data-cal="source" data-source-kind="${e.kind}" data-source-index="${e.index}">${e.kind==='goal'?'Editar meta':'Editar concurso'}</button>`}</div></article>`).join(''):'<p class="calendar-muted">Nenhum compromisso ou prazo nesta data.</p>'}
  <form id="cal-day-form"><h4>Registro do dia</h4>${future?'<p class="no-future">Os cuidados, o humor, a água e o sono podem ser preenchidos quando a data chegar. Você já pode salvar anotações e compromissos.</p>':''}
  <fieldset ${future?'disabled':''}><label class="field">Nível de energia<select id="cal-mode">${[['normal','Rotina normal'],['leve','Rotina leve'],['dificil','Só o essencial']].map(([k,t])=>`<option value="${k}" ${(log?.mode||'normal')===k?'selected':''}>${t}</option>`).join('')}</select></label><div class="fields"><label class="field">Água (copos)<input id="cal-water" type="number" min="0" max="100" step="1" value="${log?.water??0}"></label><label class="field">Sono (horas)<input id="cal-sleep" type="number" min="0" max="24" step="0.5" value="${E(log?.sleep??'')}"></label></div>
  <label class="field">Humor<select id="cal-mood" class="cal-day-mood"><option value="0">Não registrado</option>${[1,2,3,4,5].map(i=>`<option value="${i}" ${log?.mood===i?'selected':''}>${FACE[i]} · ${i} de 5</option>`).join('')}</select></label>
  <details class="cal-care-details"><summary>Cuidados · ${(log?.ids||[]).length} registrados</summary>${!log?.routine&&this.selected!==today()?'<p class="calendar-muted">Esta data usa os itens da rotina atual. Os próximos registros guardarão também os nomes dos cuidados.</p>':''}${routine.length?routine.map((c,i)=>`<label class="cal-care"><input type="checkbox" name="care-${i}" data-care-id="${E(c.id)}" ${(log?.ids||[]).includes(c.id)?'checked':''}><span>${E(c.t)}${(log?.skip||[]).includes(c.id)?'<small class="skip-state">Não se aplica neste dia</small>':''}</span></label>`).join(''):'<p class="calendar-muted">Nenhum cuidado cadastrado.</p>'}</details></fieldset>
  <label class="field" style="margin-top:18px">Anotações<textarea id="cal-note" maxlength="5000" placeholder="Anote o que quiser guardar nesta data.">${E(log?.note||'')}</textarea></label><p id="cal-day-error" class="cal-day-error" role="alert" hidden></p><div class="cal-day-actions"><button class="btn primary" type="submit">Salvar dia</button><span id="cal-save-state" class="cal-save-state">${calendarHasRecord(log)?'Registro salvo':'Sem registro'}</span></div></form></section></div>
  <footer class="calendar-footer">Calendário do aparelho · registros salvos neste navegador e incluídos no backup.</footer>`;
  $('#cal-day-form').addEventListener('submit',e=>{e.preventDefault();this.saveDay()});
  $('#cal-day-form').addEventListener('input',()=>this.markDirty());$('#cal-day-form').addEventListener('change',()=>this.markDirty());
  $('#cal-month').onchange=e=>this.setMonth(+$('#cal-year').value,+e.target.value);$('#cal-year').onchange=e=>this.setMonth(+e.target.value,+$('#cal-month').value);$('#cal-year').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();this.setMonth(+e.target.value,+$('#cal-month').value)}};
 },
 saveDay(){
  const form=$('#cal-day-form');if(!form||!form.reportValidity())return false;const date=this.selected,future=date>today(),previous=S.log[date]||{ids:[],skip:[],water:0,mood:0,sleep:'',mode:'normal',plan:[]},note=$('#cal-note').value.trim();
  const next={...previous,note,recorded:true,editedAt:new Date().toISOString()};
  if(!future){const ids=Array.from(form.querySelectorAll('[data-care-id]:checked')).map(el=>el.dataset.careId);Object.assign(next,{ids,skip:(previous.skip||[]).filter(id=>!ids.includes(id)),water:Math.round(clamp($('#cal-water').value,0,100,0)),sleep:$('#cal-sleep').value===''?'':clamp($('#cal-sleep').value,0,24,0),mood:+$('#cal-mood').value,mode:$('#cal-mode').value,routine:calendarRoutine(this.activeRoutine)})}
  S.log[date]=next;if(!save()){const err=$('#cal-day-error');err.hidden=false;err.textContent='O registro está nesta sessão, mas não foi salvo no navegador. Exporte um backup.';return false}
  this.dirty=false;R();this.render();toast('Dia '+fd(date)+' salvo.');return true;
 },
 eventForm(id){const current=id?(S.events||[]).find(e=>e.id===id):{date:this.selected,t:'',time:'',note:''};if(!current)return;modal(id?'Editar compromisso':'Novo compromisso',field('t','Título','text',current.t)+`<div class="fields">`+field('date','Data','date',current.date)+field('time','Horário (opcional)','time',current.time)+`</div>`+field('note','Observações (opcional)','textarea',current.note),v=>{if(!v.t.trim())throw Error('Preencha o título.');if(!validDate(v.date)||+v.date.slice(0,4)<1900)throw Error('Escolha uma data válida entre 1900 e 9999.');if(v.time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(v.time))throw Error('Escolha um horário válido.');const event={id:current.id||uid(),t:v.t.trim().slice(0,500),date:v.date,time:v.time,note:v.note.trim().slice(0,5000)};if(id)Object.assign(current,event);else S.events.push(event);commit();this.selected=event.date;const d=new Date(event.date+'T12:00');this.year=d.getFullYear();this.month=d.getMonth()},'Salvar compromisso')},
 deleteEvent(id){const current=S.events.find(e=>e.id===id);if(!current)return;modal('Excluir compromisso',`<p>Excluir <strong>${E(current.t)}</strong> de ${fd(current.date)}?</p>`,()=>{S.events=S.events.filter(e=>e.id!==id);commit()},'Excluir')}
};
calendarDock.onclick=()=>Calendar.open();
calendarWindow.addEventListener('cancel',e=>{e.preventDefault();Calendar.close()});
calendarWindow.addEventListener('close',()=>{Calendar.dirty=false;if(Calendar.opener?.isConnected)Calendar.opener.focus({preventScroll:true});else calendarDock.focus({preventScroll:true})});
calendarWindow.addEventListener('click',e=>{const b=e.target.closest('[data-cal]');if(!b||b.disabled)return;const action=b.dataset.cal;if(action==='date')return Calendar.choose(b.dataset.calDate);if(action==='prev')return Calendar.changeMonth(-1);if(action==='next')return Calendar.changeMonth(1);if(action==='go')return Calendar.setMonth(+$('#cal-year').value,+$('#cal-month').value);if(action==='today')return Calendar.choose(today());if(action==='close')return Calendar.close();if(action==='details')return $('#cal-day-title').scrollIntoView({behavior:'smooth',block:'start'});if(action==='add-event')return Calendar.request(()=>Calendar.eventForm());if(action==='edit-event')return Calendar.request(()=>Calendar.eventForm(b.dataset.eventId));if(action==='delete-event')return Calendar.request(()=>Calendar.deleteEvent(b.dataset.eventId));if(action==='source')return Calendar.request(()=>b.dataset.sourceKind==='goal'?A.ged(+b.dataset.sourceIndex):A.cned(+b.dataset.sourceIndex))});
calendarWindow.addEventListener('keydown',e=>{const b=e.target.closest('[data-cal-date]');if(!b)return;const offsets={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};if(Object.hasOwn(offsets,e.key)){e.preventDefault();const d=new Date(b.dataset.calDate+'T12:00');d.setDate(d.getDate()+offsets[e.key]);Calendar.choose(calendarISO(d))}else if(e.key==='PageUp'||e.key==='PageDown'){e.preventDefault();Calendar.changeMonth(e.key==='PageUp'?-1:1)}});
dlg.addEventListener('close',()=>{if(Calendar.rootOpen()){if(!Calendar.dirty){Calendar.render();$('#cal-day-title')?.focus({preventScroll:true})}else{$('#cal-month').value=Calendar.month;$('#cal-year').value=Calendar.year}}});
const saveWithCalendarBase=save;
save=function(){if(S.log?.[today()])S.log[today()].routine=calendarRoutine(S.check);return saveWithCalendarBase()};
// The seven-day summary now opens the matching day in the full calendar.
const renderCareCalendarBase=V.cui;
V.cui=function(){return renderCareCalendarBase().replace('Últimos sete dias','Últimos sete dias').replace('<div class="mood">','<div class="row" style="justify-content:space-between;margin-bottom:15px"><span class="mu">Hoje e os seis dias anteriores</span><button class="btn sm" data-a="opencalendar">▦ Abrir calendário</button></div><div class="mood">')};
A.opencalendar=()=>Calendar.open();A.caldate=date=>{Calendar.open();Calendar.choose(date)};
const calendarRefreshBase=checkDay;
checkDay=function(){const was=lastDay;calendarRefreshBase();if(was!==lastDay&&Calendar.rootOpen()&&!Calendar.dirty)Calendar.render()};

const deadlinesBeforeCalendar=deadlines;
deadlines=function(){const all=deadlinesBeforeCalendar();(S.events||[]).filter(e=>e.date>=today()).forEach(e=>all.push([e.date,(e.time?e.time+' · ':'')+e.t]));return all.sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1],'pt-BR'))};

pick=Math.floor(Math.random()*1e3);day();save();P.reset();R();
